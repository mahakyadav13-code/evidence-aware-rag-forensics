<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="900" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>

  <text x="500" y="35" font-family="Helvetica" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a2b4c">Full System Architecture — Evidence-Aware RAG Pipeline</text>

  <g font-family="Helvetica" font-size="13">
    <!-- Raw Evidence -->
    <rect x="350" y="60" width="300" height="60" rx="8" fill="#F0F0F0" stroke="#555" stroke-width="1.5"/>
    <text x="500" y="95" text-anchor="middle" font-weight="bold" fill="#333">Raw Evidence Files</text>
    <text x="500" y="112" text-anchor="middle" font-size="11" fill="#666">chat, call, file, network, location logs</text>

    <!-- 1 Ingestion -->
    <rect x="350" y="150" width="300" height="70" rx="8" fill="#E8EEF9" stroke="#2E4A7A" stroke-width="1.5"/>
    <text x="500" y="178" text-anchor="middle" font-weight="bold" fill="#1a2b4c">[1] Ingestion</text>
    <text x="500" y="196" text-anchor="middle" font-size="11" fill="#333">Parsers per evidence type &#8594; common schema</text>

    <!-- 2 Normalization -->
    <rect x="350" y="250" width="300" height="70" rx="8" fill="#E8EEF9" stroke="#2E4A7A" stroke-width="1.5"/>
    <text x="500" y="278" text-anchor="middle" font-weight="bold" fill="#1a2b4c">[2] Normalization</text>
    <text x="500" y="296" text-anchor="middle" font-size="11" fill="#333">Timestamp + entity ID normalization</text>

    <!-- 3 Correlation Engine -->
    <rect x="350" y="350" width="300" height="80" rx="8" fill="#FDEFE0" stroke="#B4650A" stroke-width="1.5"/>
    <text x="500" y="378" text-anchor="middle" font-weight="bold" fill="#7A4300">[3] Correlation Engine (KG)</text>
    <text x="500" y="396" text-anchor="middle" font-size="11" fill="#333">Entities, devices &amp; timestamps linked</text>
    <text x="500" y="412" text-anchor="middle" font-size="11" fill="#333">as a knowledge graph</text>

    <!-- 4 Evidence-Aware Retriever -->
    <rect x="330" y="460" width="340" height="90" rx="8" fill="#FDEFE0" stroke="#B4650A" stroke-width="1.5"/>
    <text x="500" y="488" text-anchor="middle" font-weight="bold" fill="#7A4300">[4] Evidence-Aware Retriever</text>
    <text x="500" y="506" text-anchor="middle" font-size="11" fill="#333">Hybrid (dense+BM25) + evidence scoring</text>
    <text x="500" y="522" text-anchor="middle" font-size="11" fill="#333">(recency, reliability, corroboration) + graph expansion</text>

    <!-- 5 Generator -->
    <rect x="350" y="580" width="300" height="70" rx="8" fill="#E9F6EC" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="500" y="608" text-anchor="middle" font-weight="bold" fill="#1B5E20">[5] Generator</text>
    <text x="500" y="626" text-anchor="middle" font-size="11" fill="#333">LLM produces report with citations</text>

    <!-- 6 Report -->
    <rect x="350" y="680" width="300" height="70" rx="8" fill="#F3E9F9" stroke="#6A1B9A" stroke-width="1.5"/>
    <text x="500" y="708" text-anchor="middle" font-weight="bold" fill="#4A0072">[6] Investigator Report</text>
    <text x="500" y="726" text-anchor="middle" font-size="11" fill="#333">Cited, traceable, admissibility-conscious</text>
  </g>

  <!-- Arrows -->
  <line x1="500" y1="120" x2="500" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="220" x2="500" y2="248" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="320" x2="500" y2="348" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="430" x2="500" y2="458" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="550" x2="500" y2="578" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="650" x2="500" y2="678" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Traceability note -->
  <rect x="720" y="150" width="240" height="600" rx="8" fill="#FFFDF5" stroke="#C9B458" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="840" y="175" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#7A6A1E">Design Principle</text>
  <text x="740" y="200" font-family="Helvetica" font-size="11" fill="#555">evidence_id and</text>
  <text x="740" y="216" font-family="Helvetica" font-size="11" fill="#555">raw_source_file</text>
  <text x="740" y="232" font-family="Helvetica" font-size="11" fill="#555">are preserved at</text>
  <text x="740" y="248" font-family="Helvetica" font-size="11" fill="#555">every stage, end</text>
  <text x="740" y="264" font-family="Helvetica" font-size="11" fill="#555">to end &#8212; so any</text>
  <text x="740" y="280" font-family="Helvetica" font-size="11" fill="#555">claim in the final</text>
  <text x="740" y="296" font-family="Helvetica" font-size="11" fill="#555">report can be</text>
  <text x="740" y="312" font-family="Helvetica" font-size="11" fill="#555">traced back to its</text>
  <text x="740" y="328" font-family="Helvetica" font-size="11" fill="#555">exact raw source.</text>

  <text x="500" y="830" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#777">
    Week 6, Day 1 &#8212; Evidence-Aware RAG for Cybercrime Investigation
  </text>
</svg>
