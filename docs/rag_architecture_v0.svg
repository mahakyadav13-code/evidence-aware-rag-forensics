<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" font-family="Helvetica" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a2b4c">Basic RAG Pipeline (v0)</text>

  <!-- Boxes -->
  <g font-family="Helvetica" font-size="12">
    <!-- 1 User Query -->
    <rect x="20" y="150" width="140" height="90" rx="8" fill="#E8EEF9" stroke="#2E4A7A" stroke-width="1.5"/>
    <text x="90" y="185" text-anchor="middle" font-weight="bold" fill="#1a2b4c">User Query</text>
    <text x="90" y="205" text-anchor="middle" fill="#333">"Who contacted</text>
    <text x="90" y="220" text-anchor="middle" fill="#333">X on the 5th?"</text>

    <!-- 2 Embed Query -->
    <rect x="200" y="150" width="140" height="90" rx="8" fill="#E8EEF9" stroke="#2E4A7A" stroke-width="1.5"/>
    <text x="270" y="185" text-anchor="middle" font-weight="bold" fill="#1a2b4c">Embed Query</text>
    <text x="270" y="205" text-anchor="middle" fill="#333">Convert text to</text>
    <text x="270" y="220" text-anchor="middle" fill="#333">a vector</text>

    <!-- 3 Vector DB Search -->
    <rect x="380" y="150" width="150" height="90" rx="8" fill="#FDEFE0" stroke="#B4650A" stroke-width="1.5"/>
    <text x="455" y="180" text-anchor="middle" font-weight="bold" fill="#7A4300">Search Vector DB</text>
    <text x="455" y="200" text-anchor="middle" fill="#333">(ChromaDB)</text>
    <text x="455" y="218" text-anchor="middle" fill="#333">Find similar chunks</text>

    <!-- 4 Retrieve top-k -->
    <rect x="570" y="150" width="150" height="90" rx="8" fill="#FDEFE0" stroke="#B4650A" stroke-width="1.5"/>
    <text x="645" y="180" text-anchor="middle" font-weight="bold" fill="#7A4300">Retrieve Top-K</text>
    <text x="645" y="200" text-anchor="middle" fill="#333">Evidence chunks</text>
    <text x="645" y="218" text-anchor="middle" fill="#333">(chat logs, etc.)</text>

    <!-- 5 Combine -->
    <rect x="760" y="60" width="150" height="90" rx="8" fill="#E9F6EC" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="835" y="90" text-anchor="middle" font-weight="bold" fill="#1B5E20">Combine</text>
    <text x="835" y="110" text-anchor="middle" fill="#333">Query + Retrieved</text>
    <text x="835" y="128" text-anchor="middle" fill="#333">chunks into prompt</text>

    <!-- 6 LLM -->
    <rect x="760" y="180" width="150" height="90" rx="8" fill="#E9F6EC" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="835" y="215" text-anchor="middle" font-weight="bold" fill="#1B5E20">LLM</text>
    <text x="835" y="235" text-anchor="middle" fill="#333">Generates grounded</text>
    <text x="835" y="250" text-anchor="middle" fill="#333">answer</text>

    <!-- 7 Answer -->
    <rect x="760" y="300" width="150" height="90" rx="8" fill="#F3E9F9" stroke="#6A1B9A" stroke-width="1.5"/>
    <text x="835" y="335" text-anchor="middle" font-weight="bold" fill="#4A0072">Answer</text>
    <text x="835" y="355" text-anchor="middle" fill="#333">Cited to evidence</text>
    <text x="835" y="370" text-anchor="middle" fill="#333">source IDs</text>
  </g>

  <!-- Arrows -->
  <line x1="160" y1="195" x2="198" y2="195" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="195" x2="378" y2="195" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="195" x2="568" y2="195" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="180" x2="758" y2="130" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="835" y1="150" x2="835" y2="178" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="835" y1="270" x2="835" y2="298" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="500" y="400" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#777">
    Week 2, Day 1 &#8212; Evidence-Aware RAG for Cybercrime Investigation
  </text>
</svg>
